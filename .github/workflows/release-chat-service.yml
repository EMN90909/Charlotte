name: Release chat-service (Rust)
on:
  push:
    tags:
      - 'chat-service-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
permissions:
  contents: write
concurrency:
  group: release-chat-service-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  binaries:
    name: Build Rust for ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: darwin-amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            label: darwin-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: server
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target "${{ matrix.target }}" --bins
      - name: Stage legacy-compatible release asset names
        run: |
          mkdir -p dist
          ext=""
          if [[ "${{ matrix.label }}" == windows-* ]]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/charlotte-server$ext" "dist/chat-service-server-${{ matrix.label }}$ext"
          cp "target/${{ matrix.target }}/release/charlotte-ops$ext" "dist/chat-service-ops-${{ matrix.label }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: chat-service-${{ matrix.label }}
          path: server/dist/chat-service-*
          if-no-files-found: error
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chat-service-*
          merge-multiple: true
          path: artifacts
      - run: cd artifacts && sha256sum chat-service-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
  notify-ops:
    needs: release
    if: ${{ vars.OPS_WEBHOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Mint Rust deploy token and notify
        working-directory: server
        env:
          OPS_JWT_SECRET: ${{ secrets.OPS_JWT_SECRET }}
        run: |
          set -euo pipefail
          VERSION="${TAG#chat-service-v}"
          LINUX_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/chat-service-server-linux-amd64"
          TOKEN=$(cargo run --quiet --release --bin charlotte-deploytoken -- -version "$VERSION" -linux "$LINUX_URL")
          curl -fsS -X POST "${{ vars.OPS_WEBHOOK_URL }}/deploy" -H "Authorization: Bearer $TOKEN" --max-time 90
