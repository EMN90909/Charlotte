name: Charlotte native Rust + CEF
on:
  pull_request:
    paths:
      - "browser/native/**"
      - ".github/workflows/browser-native.yml"
  push:
    branches: [main, rust-conversion]
    paths:
      - "browser/native/**"
      - ".github/workflows/browser-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-cef:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: browser/native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux CEF system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libnss3-dev libasound2-dev libx11-dev libxkbcommon-dev libdbus-1-dev pkg-config xvfb curl
      - name: Compile native Rust tests
        run: cargo test --all-targets
      - name: Build native CEF host and helpers
        run: cargo build --release --bins
      - name: Install pinned CEF bundle/export tools
        run: |
          cargo install cef --version '156.2.0+156.0.14' --features build-util --bin bundle-cef-app
          cargo install export-cef-dir --version '156.2.0+156.0.14'
      - name: Export matching CEF runtime (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export-cef-dir --force "$RUNNER_TEMP/charlotte-cef"
          echo "CEF_PATH=$RUNNER_TEMP/charlotte-cef" >> "$GITHUB_ENV"
      - name: Export matching CEF runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          export-cef-dir --force "$env:RUNNER_TEMP\charlotte-cef"
          "CEF_PATH=$env:RUNNER_TEMP\charlotte-cef" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Bundle Linux/macOS CEF
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/build.sh
      - name: Bundle Windows CEF
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\build.bat
      - name: Linux Chromium runtime smoke
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/smoke-native.sh
      - name: macOS Chromium runtime smoke
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/smoke-native-macos.sh
      - name: Windows Chromium runtime smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-native.ps1
