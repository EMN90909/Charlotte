name: Charlotte native Rust + CEF
on:
  pull_request:
    paths:
      - "browser/native/**"
      - ".github/workflows/browser-native.yml"
  push:
    branches: [main, rust-conversion]
    paths:
      - "browser/native/**"
      - ".github/workflows/browser-native.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-cef:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: browser/native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libnss3-dev libasound2-dev libx11-dev libxkbcommon-dev xvfb
      - name: Compile and test native browser
        run: cargo test --lib
      - name: Compile CEF app and helper
        run: cargo build --release --bins
