name: Release Charlotte Native

on:
  push:
    tags: ["browser-v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: browser

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            installer: true
          - os: macos-latest
            artifact: macos-universal
            installer: false
          - os: ubuntu-latest
            artifact: linux-x64
            installer: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: browser
      - name: Bundle Charlotte
        shell: bash
        if: runner.os != 'Windows'
        run: scripts/build.sh
      - name: Build Windows Setup
        if: matrix.installer
        shell: pwsh
        run: scripts/package-windows.ps1
      - name: Bundle archive
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C target -czf "Charlotte-${{ matrix.artifact }}.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            browser/target/installer/*.exe
            browser/target/*.tar.gz
