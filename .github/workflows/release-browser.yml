name: Release Charlotte Native (Rust + CEF)
on:
  push:
    tags: ['browser-v*']
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: 'Browser release tag'
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  native:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x64
          - runner: ubuntu-24.04-arm
            label: linux-arm64
          - runner: macos-15
            label: macos-arm64
          - runner: windows-2022
            label: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: browser/native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libnss3-dev libasound2-dev libx11-dev libxkbcommon-dev pkg-config libdbus-1-dev zip
      - name: Unit tests
        run: cargo test --lib
      - name: Install matching CEF packager
        run: cargo install cef --version '156.2.0+156.0.14' --features build-util --bin bundle-cef-app
      - name: Install CEF export utility
        run: cargo install --git https://github.com/tauri-apps/cef-rs --package export-cef-dir --bin export-cef-dir
      - name: Export CEF runtime (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export-cef-dir --force "$RUNNER_TEMP/charlotte-cef"
          echo "CEF_PATH=$RUNNER_TEMP/charlotte-cef" >> "$GITHUB_ENV"
      - name: Export CEF runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          export-cef-dir --force "$env:RUNNER_TEMP\charlotte-cef"
          "CEF_PATH=$env:RUNNER_TEMP\charlotte-cef" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Bundle native browser (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/build.sh
      - name: Bundle native browser (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\build.bat
      - name: Native CEF runtime smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/smoke-native.sh
      - name: Native CEF runtime smoke (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/smoke-native-macos.sh
      - name: Native CEF runtime smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-native.ps1
      - name: Archive POSIX bundle preserving file modes and symlinks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "target/Charlotte-${{ matrix.label }}.tar.gz" -C target/bundle .
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/bundle/* -DestinationPath "target/Charlotte-${{ matrix.label }}.zip"
      - name: Upload native archive
        uses: actions/upload-artifact@v4
        with:
          name: Charlotte-${{ matrix.label }}
          path: |
            browser/native/target/Charlotte-*.tar.gz
            browser/native/target/Charlotte-*.zip
          if-no-files-found: error
  publish:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Charlotte-*
          path: output
      - run: |
          cd output
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -print0 | sort -z | xargs -0 sha256sum > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: true
          files: |
            output/**/*.tar.gz
            output/**/*.zip
            output/checksums.txt
