name: Charlotte branding and type checks

on:
  push:
    branches: [main]
    paths:
      - 'browser/**'
      - 'website/**'
      - 'scripts/check-charlotte-branding.mjs'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/charlotte-checks.yml'
  pull_request:
    paths:
      - 'browser/**'
      - 'website/**'
      - 'scripts/check-charlotte-branding.mjs'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/charlotte-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify original MIT rights and Charlotte branding
        run: node scripts/check-charlotte-branding.mjs

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go test ./...
      - run: go build ./cmd/server

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [browser, website]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Test network ad blocker
        if: matrix.component == 'browser'
        run: npm run test:adblock && npm run test:openshield
      - name: Verify static website output
        if: matrix.component == 'website'
        run: npm run build

