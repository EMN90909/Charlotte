name: Charlotte branding and type checks

on:
  push:
    branches: [main]
    paths:
      - 'browser/**'
      - 'website/**'
      - 'scripts/check-charlotte-branding.mjs'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/charlotte-checks.yml'
  pull_request:
    paths:
      - 'browser/**'
      - 'website/**'
      - 'scripts/check-charlotte-branding.mjs'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/charlotte-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original MIT rights and Charlotte branding
        run: node scripts/check-charlotte-branding.mjs

  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo build --release --bins

  browser-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install required Rust native libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: cargo test --all-targets
      - run: cargo build --release --bins

  website-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

