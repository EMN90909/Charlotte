name: Charlotte Cloud Gateway
on:
  pull_request:
    paths:
      - 'services/**'
      - '.github/workflows/charlotte-cloud.yml'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/charlotte-cloud.yml'
permissions:
  contents: read
jobs:
  node-cloud-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and dependency-free tests
        run: |
          npm run check
          npm test
      - name: Confirm no real secrets are committed
        run: |
          test ! -f .env
          test ! -f update-private.pem
