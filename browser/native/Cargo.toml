[package]
name = "Charlotte"
version = "0.4.0"
edition = "2024"
description = "Charlotte Native – a Rust host for Chromium Embedded Framework"
license-file = "../LICENSE"
authors = ["Noethric <engineering@noethric.com>"]
build = "build.rs"

[package.metadata.cef.bundle]
helper_name = "Charlotte Helper"
resources_path = "resources"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]

[dependencies]
cef = "=156.2.0+156.0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
adblock = "=0.13.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[build-dependencies]
embed-resource = "3.0.2"
