<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Cross-origin iframe fixture</title>
<style>body{background:#e9f5fa;color:#173146;font:15px system-ui;padding:12px}
button{padding:12px;border-radius:6px;border:1px solid #4d788d}
</style></head><body>
<strong>Isolated cross-origin frame</strong>
<button id="cross-click" type="button" onclick="document.querySelector('#state').textContent='Cross-frame click received'">Click iframe button</button>
<output id="state">Not clicked</output></body></html>
