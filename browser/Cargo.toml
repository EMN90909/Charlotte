[package]
name = "Charlotte"
version = "0.4.0"
edition = "2024"
description = "Charlotte Native — Rust desktop browser with CEF and WebView2 hosts"
license-file = "LICENSE"
authors = ["Noethric <engineering@noethric.com>"]
build = "build.rs"

[lib]
name = "charlotte_native"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "Charlotte"
path = "src/bin/charlotte.rs"

[[bin]]
name = "charlotte-settings"
path = "src/bin/charlotte_settings.rs"

[[bin]]
name = "charlotte_helper"
path = "src/bin/charlotte_helper.rs"

[[bin]]
name = "charlotte-installer"
path = "src/bin/charlotte_installer.rs"

[package.metadata.cef.bundle]
helper_name = "charlotte_helper"
resources_path = "resources"

# Platform Web Engine Routing:
# - Linux: WebKitGTK engine links with system GTK 3 & WebKitGTK (pkg-config `gtk+-3.0`, `webkit2gtk-4.1` / `4.0`).
#   Dev packages: `libgtk-3-dev`, `libwebkit2gtk-4.1-dev`, `pkg-config`.
# - Windows: WebView2 engine connects via COM interfaces to WebView2Loader (Evergreen on Win10/11;
#   Fixed Version 109 ESR on Windows 7/8/8.1 x86 & x64).
# - CEF: Optional Chromium Embedded Framework feature ("cef-engine").
[features]
default = []
cef-engine = ["dep:cef"]
sandbox = ["cef-engine", "cef/sandbox"]

[dependencies]
cef = { version = "=156.2.0+156.0.14", features = ["build-util"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
ring = "0.17"
url = "2"
axum = { version = "0.7", features = ["form"] }
tokio = { version = "1.42", features = ["rt", "macros", "net"] }
rand = "0.8"
rpassword = "7"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Real native Win32 + WebView2 window host for the default non-CEF build.
[target.'cfg(target_os = "windows")'.dependencies]
tao = "0.37.3"
wry = { version = "0.57.3", default-features = false, features = ["os-webview"] }

[build-dependencies]
embed-resource = "3.0.2"

# Optimise the Rust host, not the Chromium renderer: keep GPU acceleration,
# site isolation, TLS validation and CEF sandboxing intact.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
