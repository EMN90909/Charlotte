[package]
name = "charlotte-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "charlotte-server"
path = "src/main.rs"
[[bin]]
name = "charlotte-ops"
path = "src/bin/ops.rs"
[[bin]]
name = "charlotte-deploytoken"
path = "src/bin/deploytoken.rs"
[[bin]]
name = "charlotte-chat"
path = "src/bin/chat.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
md5 = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tonic = "0.12"
prost = "0.13"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
