name: Charlotte server standalone CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test the server without parent directories
        run: make verify-standalone
      - name: Native server smoke test
        run: make smoke
      - name: Cross-compile release binaries
        run: make build-all
      - name: Upload native release binaries and checksums
        uses: actions/upload-artifact@v4
        with:
          name: charlotte-server-binaries
          path: dist/*
      - name: Verify Docker build
        run: make docker
